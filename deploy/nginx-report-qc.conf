# =============================================================================
# 星衍放射质控软件 —— nginx HTTPS 反向代理示例（院内服务器 / Linux）
# =============================================================================
# 用途：把 127.0.0.1:8500 上的 FastAPI（SPA + API 同源）以 HTTPS 暴露给院内网段。
# 放置：/etc/nginx/conf.d/report-qc.conf   （Debian/Ubuntu: sites-available + 软链）
# 校验：nginx -t && systemctl reload nginx
#
# ⚠️ 使用前必读（三个安全前提，缺一不可）：
#   1) 后方应用必须由反代注入真实客户端 IP，否则审计日志只记到反代自身；
#      且当反代与应用同机（127.0.0.1）时，若不处理，**所有远程用户都会被应用
#      当成「本机用户」**（server/security.py 的 require_emp_local / X-Emp-Id 兜底
#      依赖 request.client.host ∈ {127.0.0.1, ::1, localhost}）→ 鉴权被绕过。
#      本文件已配合 proxy_set_header X-Forwarded-For，应用侧必须同时按
#      deploy/README.md「uvicorn 代理头」启动（--proxy-headers / --forwarded-allow-ips）。
#   2) 应用进程应只监听 127.0.0.1 或内网地址，禁止 0.0.0.0 直接暴露公网/院内全网。
#   3) 反代监听端口必须用防火墙限制为院内网段（见下方 allow/deny）。
#
# 占位符（请替换）：qc.example.hospital.local、/etc/ssl/... 证书路径、内网网段
# =============================================================================

# --- 上游：应用进程（uvicorn / python server/main.py）-------------------------
# 应用默认端口见 server/main.py（--port / QC_PORT，本项目交付基线为 8500）。
upstream report_qc_backend {
    server 127.0.0.1:8500;
    keepalive 16;                      # 复用后端长连接，降低医生端并发时的握手开销
}

# --- HTTP：仅用于跳转 HTTPS（不要在 80 端口提供任何业务）---------------------
server {
    listen      80;
    listen      [::]:80;
    server_name qc.example.hospital.local;   # ← 替换为院内实际域名

    # 隐藏版本号（server_tokens 也可放 http 块统一生效）
    server_tokens off;

    # 内网限制：只允许院内网段访问 80（跳转入口）
    allow 10.0.0.0/8;                  # ← 替换/增删为院内真实网段
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny  all;

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS：主服务 -----------------------------------------------------------
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name qc.example.hospital.local;   # ← 替换

    # ---- TLS 证书（院内证书或信息科统一签发的服务器证书）----
    # 若用院内 CA：把根证书/中间证书放在 ssl_certificate 的 fullchain 文件里
    ssl_certificate     /etc/ssl/report-qc/fullchain.pem;   # ← 替换
    ssl_certificate_key /etc/ssl/report-qc/privkey.pem;     # ← 替换
    ssl_trusted_certificate /etc/ssl/report-qc/chain.pem;   # OCSP stapling 用，可省

    # ---- TLS 协议与套件（只留 TLS1.2/1.3；医院常见合规测评会检查此项）----
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    # ---- HSTS ----
    # 先从小 max-age 观察（如 max-age=300），确认全站 HTTPS 正常后再加长。
    # 一旦包含 includeSubDomains 且本院还有 HTTP 子系统，会一并被强制 HTTPS，需信息科确认。
    add_header Strict-Transport-Security "max-age=31536000" always;   # 视情况追加 includeSubDomains

    # ---- 隐藏版本号 ----
    server_tokens off;

    # ---- 内网限制（第一道闸；防火墙规则仍必须配置）----
    allow 10.0.0.0/8;                  # ← 替换/增删为院内真实网段
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny  all;

    # ---- 上传体积 ----
    # 应用侧上限：OCR 图片 QC_OCR_MAX_BYTES 默认 20MB；导入接口 20MB。
    # 这里留一点余量到 25m，否则 nginx 会先于应用返回 413。
    client_max_body_size 25m;
    client_body_timeout  120s;

    # ---- 响应头（应用已设置 Referrer-Policy，这里补通用项；避免重复添加）----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;   # 桌面 WebView/浏览器内嵌通用
    # 注意：应用自身会下发 Content-Security-Policy；若此处再 add_header 同名头会产生两份，
    #       冲突时以更严格者生效，可能白屏。如需在此统一管理，请先确认应用侧已不再下发。

    # ---- 真实 IP 透传给应用（审计日志 & 本机判定都依赖它）----
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    # 若上游还挂了另一层反代/负载均衡，请改用 real_ip 模块取最左侧可信 IP（见文末）。

    # ---- 超时 ----
    # 应用内 LLM 超时默认 30s 且可能重试；报告解析/OCR 也可能较慢。
    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;
    proxy_read_timeout    180s;        # 跑 LLM 质控时不要低于应用端超时
    send_timeout          120s;

    proxy_http_version 1.1;

    # ⚠️ WebSocket：本应用**不使用** WebSocket / SSE（前端为轮询 + 普通 REST），
    #    因此**不需要**下面两行。若未来引入实时推送再放开：
    # proxy_set_header Upgrade    $http_upgrade;
    # proxy_set_header Connection "upgrade";

    # ---- 业务路由（SPA 与 API 同源，统一转发即可）----
    location / {
        proxy_pass http://report_qc_backend;
        proxy_buffering off;           # 大响应/流式更稳；也可保持默认 on
    }

    # ---- 静态资源：交由应用自带缓存头处理；如需 nginx 直出，可将 root 指到 web/static
    # location /static/ { proxy_pass http://report_qc_backend; expires 7d; }

    # ---- 健康检查（供院内监控探活，不写审计敏感面）----
    location = /api/v1/health {
        proxy_pass http://report_qc_backend;
        access_log off;
    }

    # ---- 访问日志：记录真实客户端 IP，便于与审计日志/测评取证比对 ----
    access_log /var/log/nginx/report-qc.access.log combined;
    error_log  /var/log/nginx/report-qc.error.log warn;
}

# =============================================================================
# 【可选】上游还有一层可信反代/LB 时，用 real_ip 还原最左侧真实 IP
# -----------------------------------------------------------------------------
# 放在 http {} 块（或本文件顶部 server 之外）：
#   set_real_ip_from 10.0.0.0/8;        # ← 只信任这几段，绝不写 0.0.0.0/0
#   real_ip_header   X-Forwarded-For;
#   real_ip_recursive on;
# 作用：使 $remote_addr / $proxy_add_x_forwarded_for 得到真实医生机 IP。
# =============================================================================
#
# =============================================================================
# 【应用侧必须配合的头 / 启动参数】
# -----------------------------------------------------------------------------
# 1) 启动 uvicorn 时信任代理头（否则 request.client.host 恒为反代 IP）：
#      uvicorn server.main:app --host 127.0.0.1 --port 8500 \
#        --proxy-headers --forwarded-allow-ips="127.0.0.1"
#    仅当反代与应用同机（本文件场景）时，--forwarded-allow-ips 填 127.0.0.1 即可；
#    如反代在另一台机器，填写该反代的内网 IP（多个用逗号分隔）。
#
# 2) 非本机监听必须显式设置 QC_API_SECRET（否则应用启动即 SystemExit）：
#      export QC_API_SECRET=<强随机串>      # 多节点必须保持一致
#
# 3) 若医生用不同 Origin 直连（而非统一走本域名），需追加 CORS 白名单：
#      export QC_CORS_ORIGINS=https://qc.example.hospital.local
#    统一走本域名单一入口时，同源请求不触发 CORS，可不设置。
#
# 4) 应用仍会自行判断 Host/端口（QC_PORT）用于本机 Origin 白名单；反代统一入口后
#    无需额外配置，但请保持 QC_PORT 与实际监听端口一致（默认 8500）。
# =============================================================================
