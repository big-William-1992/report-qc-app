name: Test Windows Auto-Update (manual)

# 手动复测入口：在真实 Windows runner 上用仓库内真实的 Windows 安装器
# （PowerShell）跑完整自动更新流程并断言。自动覆盖由 build-windows.yml 的
# test-update job 提供（构建发布 latest 后自动执行），本工作流用于按需调试。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-win-update:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Windows auto-update end-to-end test
        run: python tests/test_windows_update.py
        shell: bash
