# 2026-08-18：Node 20 弃用迁移——actions 全部升级到 Node 24 版本
#   （checkout v5 / setup-python v6 / upload-download-artifact v5 / gh-release v3）
name: Build Windows (exe + installer)

# 触发：手动点一下 / 推到 main
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest   # 真实 x64 Windows Server，产物兼容绝大多数 PC
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            constraints.txt

      - name: Install PyInstaller + cryptography
        run: python -m pip install --upgrade pip pyinstaller cryptography

      - name: Install dependencies (requirements.txt + constraints.txt)
        # 关键：屏幕区域 OCR 所需的全部「插件」（rapidocr/onnxruntime/opencv/pyclipper/Shapely 等）
        # 以及 WebView 桌面壳（pywebview）、FastAPI 后端（fastapi/uvicorn/python-multipart）
        # 必须在打包前装好，否则 PyInstaller 收不到这些模块，exe 内会 ModuleNotFoundError。
        # constraints.txt 锁定核心栈版本，杜绝上游发新版导致的 CI 漂移（2026-08-25）。
        run: python -m pip install -r requirements.txt -c constraints.txt

      - name: Force opencv headless (瘦身 30~40MB)
        # rapidocr-onnxruntime 自身依赖声明会把完整版 opencv-python 拉进来，
        # 与 headless 并存时 PyInstaller 会打进完整版的 GUI dll，白白多几十 MB。
        # 因此装完依赖后强制卸载完整版，只保留 headless（cv2 模块名相同，功能对 OCR 等价）。
        run: |
          python -m pip uninstall -y opencv-python opencv-contrib-python
          python -m pip install --force-reinstall opencv-python-headless
          python -c "import cv2; print('cv2 OK (headless):', cv2.__version__)"

      - name: Lint 闸 (ruff 致命规则, BLOCKING; 2026-08-25 审计新增)
        # F821 未定义名/F822 __all__ 漏导出/F811 重复定义——历史上三次真实事故的克星
        run: |
          python -m pip install ruff
          python -m ruff check src/ server/

      - name: Dependency audit (pip-audit, 已知CVE阻断)
        continue-on-error: true   # 首期观察模式: 有CVE不阻断, 输出到日志人工评估
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r requirements.txt --desc

      - name: 单元测试闸（pytest test/ + tests/，2026-08-18 新增；2026-08-23 恢复阻断）
        # 2026-08-23：本机基线 324 passed / 7 skipped 全绿，恢复为阻断闸
        # （此前 continue-on-error 只是临时降级，坏代码曾一路流到 Release）。
        # 2026-08-25：输出落盘并在失败时上传 artifact，便于无 admin 权限时诊断。
        shell: bash
        run: |
          python -m pip install pytest
          set +e
          python -m pytest test/ tests/ -q --tb=short > pytest_output.txt 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "::error::PYTEST_FAILED exit=$rc"
            grep -E "^(FAILED|ERROR) " pytest_output.txt | head -30 | while IFS= read -r line; do echo "::error::$line"; done
            tail -25 pytest_output.txt | while IFS= read -r line; do [ -n "$line" ] && echo "::error::$line"; done
          fi
          exit $rc

      - name: Upload pytest output on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: pytest-output
          path: pytest_output.txt

      - name: Resolve app version (src/version.py → APP_VERSION env)
        # 安装包版本号单一事实来源：src/version.py 的 APP_VERSION，
        # 经 /DAppVersion= 注入 Inno Setup（setup.iss 用 #ifndef 兜底默认值）。
        shell: bash
        run: |
          VER=$(python -c "import sys; sys.path.insert(0, 'src'); from version import APP_VERSION; print(APP_VERSION)")
          echo "APP_VERSION=$VER" >> "$GITHUB_ENV"
          echo "APP_VERSION resolved: $VER"

      - name: Write build info (供软件内检查更新比对)
        shell: bash
        run: |
          mkdir -p assets
          python - <<'PY'
          import json, datetime, os
          info = {
              "build_time": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"),
              "commit": os.environ.get("GITHUB_SHA", "")[:7] or "ci",
          }
          with open("assets/build_info.json", "w", encoding="utf-8") as f:
              json.dump(info, f, ensure_ascii=False, indent=2)
          print("build_info:", info)
          PY

      - name: Build exe (PyInstaller)
        run: python -m PyInstaller build/report_qc.spec --noconfirm --clean

      - name: Smoke test - engine import & run
        # 干净环境下验证引擎能正常 import 并跑一份示例报告（抓逻辑层错误）
        # 非阻断：即使引擎冒烟测试出问题，也不影响 exe 产物的上传
        run: python build/smoke_test.py
        continue-on-error: true

      # ---- 产物先上传，避免后续校验告警导致丢失 exe ----
      - name: Upload exe artifact
        uses: actions/upload-artifact@v5
        with:
          name: report-qc-exe
          path: dist/报告质控软件/
          if-no-files-found: warn

      - name: Verify bundle (OCR 模型 + web 前端 + server 后端)
        # 非阻断：确认关键资源真的打进了 dist（防止「假成功」）。
        # 失败只告警，不影响已上传的 exe 产物与 Release 发布。
        shell: bash
        env:
          PYTHONUTF8: "1"
        continue-on-error: true
        run: |
          python - <<'PY'
          import os, sys
          ok = True
          # 1) OCR Python 依赖必须能 import
          for m in ("rapidocr_onnxruntime", "onnxruntime", "cv2", "numpy", "PIL", "pyclipper", "shapely"):
              try:
                  __import__(m)
                  print("  import OK:", m)
              except Exception as e:
                  print("  import FAIL:", m, "->", e); ok = False
          # 1.5) 必须是 headless 版 opencv
          from importlib import metadata
          def has(pkg):
              try: metadata.version(pkg); return True
              except Exception: return False
          if has("opencv-python") or has("opencv-contrib-python"):
              print("  FAIL: full opencv-python present, should be headless only"); ok = False
          elif has("opencv-python-headless"):
              print("  opencv headless OK:", metadata.version("opencv-python-headless"))
          else:
              print("  FAIL: no opencv package found"); ok = False
          # 2) 离线 OCR 模型：源(assets) 与 打包后(dist) 都要核对
          src_dir = os.path.join("assets", "ocr_models")
          src_files = sorted(os.listdir(src_dir)) if os.path.isdir(src_dir) else []
          print("  SRC assets/ocr_models:", src_files)
          if not src_files:
              print("  SRC OCR models MISSING (checkout 未拉到 onnx?)"); ok = False
          dist_onnx = []
          if os.path.isdir("dist"):
              for root, dirs, files in os.walk("dist"):
                  if os.path.basename(root) == "ocr_models":
                      dist_onnx = sorted(f for f in files if f.endswith(".onnx"))
          print("  DIST ocr_models onnx found:", dist_onnx)
          if len(dist_onnx) < 3:
              print("  DIST OCR models MISSING (PyInstaller 未打包 assets/ocr_models)"); ok = False
          else:
              print("  OCR models bundled OK")
          # 3) 前端 SPA 与后端必须打进 dist
          dist_index = []
          dist_server_main = []
          if os.path.isdir("dist"):
              for root, dirs, files in os.walk("dist"):
                  if os.path.basename(files) == "index.html" and os.path.basename(os.path.dirname(root)) == "static":
                      dist_index.append(os.path.join(root, "index.html"))
                  if "server" in dirs and os.path.exists(os.path.join(root, "server", "main.py")):
                      dist_server_main.append(os.path.join(root, "server", "main.py"))
          print("  DIST web/static/index.html found:", bool(dist_index))
          if not dist_index:
              print("  DIST 前端 SPA 缺失 (PyInstaller 未打包 web/static)"); ok = False
          print("  DIST server/main.py found:", bool(dist_server_main))
          if not dist_server_main:
              print("  DIST 后端 server/main.py 缺失 (PyInstaller 未打包 server/)"); ok = False
          print("VERIFY", "OK" if ok else "HAS ISSUES (非阻断)")
          sys.exit(0 if ok else 1)
          PY

      # ---- 打包绿色版 zip（供 Release 下载，解压即用）----
      - name: Package portable zip
        run: Compress-Archive -Path "dist/报告质控软件/*" -DestinationPath "report-qc-portable.zip" -Force

      # ---- 2026-08-23：发布链路重排——build 只产 artifact，不再直接发 Release ----
      # Release 发布挪到独立 publish job，且以 launch-test 通过为前置条件
      # （build → launch-test → publish），坏包不再有机会流出。

      # ---- 阻断闸（BLOCKING）：打包产物里 pythonnet/clr 必须可加载（Windows 桌面壳关键） ----
      # 此前用户下载后报「Failed to resolve Python.Runtime.Loader.Initialize」，
      # 根因：Python.Runtime.dll 被 UPX 压缩破坏 CLR 元数据 + runtime 目录层级不对。
      # 注意：
      #   1) 必须为阻断闸（fail-fast）：若 clr 加载失败，构建直接失败，不允许把
      #      「下载即崩」的坏包发布到 Release（历史教训：continue-on-error 导致坏包流出）。
      #   2) 关键认知：Python.Runtime.Loader.Initialize 是 CLR 托管方法（clr_loader
      #      通过 pyclr_get_function 反射解析），不是 PE 原生导出符号，因此不能用
      #      ctypes.GetProcAddress 探测（对托管方法恒失败，会误报）。正确验证 = 检查
      #      DLL 是有效 PE + 是 .NET 程序集 + 无 UPX 压缩标记 + 运行时各部件齐全。
      - name: Verify pythonnet clr loads from bundle (BLOCKING)
        shell: bash
        continue-on-error: false
        env:
          PYTHONNET_RUNTIME: "netfx"
          PYTHONUTF8: "1"
        run: |
          python - <<'PY'
          import os, sys, glob, struct
          dist_root = "dist"
          failures = []

          def fail(msg):
              failures.append(msg)
              print("FAIL:", msg)

          def is_valid_net_dll(path):
              """检查 DLL：有效 PE + 是 .NET 程序集（CLR 元数据头）+ 无 UPX 压缩标记。
              这是『Python.Runtime.Loader.Initialize 能否被 CLR 反射加载』的直接可观测信号——
              UPX 压缩 .NET 程序集会破坏 CLR 头，Assembly.Load 失败 → clr_loader 报
              "Failed to resolve Python.Runtime.Loader.Initialize"（pyclr_get_function 返回 NULL）。"""
              with open(path, "rb") as f:
                  data = f.read()
              if data[:2] != b"MZ":
                  return False, "不是有效 PE 文件（缺 MZ 头）"
              if b"UPX!" in data[:4096] or b"UPX!" in data[-256:]:
                  return False, "被 UPX 压缩（含 UPX! 标记），CLR 元数据会被破坏"
              # 找 PE 头偏移（e_lfanew @ 0x3C）
              pe_off = struct.unpack_from("<I", data, 0x3C)[0]
              if pe_off + 24 > len(data) or data[pe_off:pe_off + 4] != b"PE\x00\x00":
                  return False, "PE 头无效"
              # 可选头 magic: 0x20B = PE32+ / 0x10B = PE32
              magic = struct.unpack_from("<H", data, pe_off + 24)[0]
              opt_size = struct.unpack_from("<H", data, pe_off + 20)[0]
              opt = pe_off + 24
              # 数据目录在可选头末尾；CLR 头是数据目录第 14 项（index 14）
              # PE32+: 数据目录起始 = opt + 112; PE32: opt + 96
              dd_off = opt + (112 if magic == 0x20B else 96)
              if dd_off + 14 * 8 + 8 > len(data):
                  return False, "数据目录越界"
              clr_rva, clr_size = struct.unpack_from("<II", data, dd_off + 14 * 8)
              if clr_rva == 0 or clr_size == 0:
                  return False, "不是 .NET 程序集（CLR 元数据目录为空）"
              return True, f"有效 .NET 程序集（CLR 头 RVA={clr_rva:#x} size={clr_size}）"

          # 1) 找到 dist 里的 pythonnet 运行时目录
          pn_runtime = None
          for root, dirs, files in os.walk(dist_root):
              if os.path.basename(root) == "runtime" and "pythonnet" in root:
                  pn_runtime = root
                  break
          print("pythonnet runtime dir:", pn_runtime)
          if not pn_runtime:
              fail("pythonnet/runtime 未打进 dist")
          else:
              dll = os.path.join(pn_runtime, "Python.Runtime.dll")
              if not os.path.exists(dll):
                  fail("Python.Runtime.dll 缺失: " + dll)
              else:
                  print("Python.Runtime.dll 存在:", dll, os.path.getsize(dll), "bytes")
                  ok, reason = is_valid_net_dll(dll)
                  print("  ->", reason)
                  if not ok:
                      fail("Python.Runtime.dll 检查失败: " + reason)

          # 2) clr_loader 的 ClrLoader.dll 也必须存在且有效
          clr_dll = glob.glob(os.path.join(dist_root, "**", "clr_loader", "ffi", "dlls", "amd64", "ClrLoader.dll"), recursive=True)
          print("ClrLoader.dll found:", clr_dll)
          if not clr_dll:
              fail("clr_loader/ffi/dlls/amd64/ClrLoader.dll 未打进 dist")
          else:
              ok, reason = is_valid_net_dll(clr_dll[0])
              print("  ->", reason)
              if not ok:
                  fail("ClrLoader.dll 检查失败: " + reason)

          # 3) Python.Runtime.dll 是 C++/CLI 混合程序集，依赖 VC++ 运行库
          vc_missing = [f for f in ("vcruntime140.dll", "msvcp140.dll", "vcruntime140_1.dll")
                        if not glob.glob(os.path.join(dist_root, "**", f), recursive=True)]
          print("VC++ 运行库检查 缺失:", vc_missing if vc_missing else "无（均已随包）")
          if vc_missing:
              print("WARN: 以下 VC++ 运行库未在 dist 中找到（目标机若无 VC++ Redistributable 可能加载失败）:",
                    ", ".join(vc_missing))

          if failures:
              print("::error::pythonnet bundle 校验失败：%d 项" % len(failures))
              sys.exit(1)
          print("PYTHONNET_BUNDLE_OK")
          PY

      # ---- 阻断闸：sqlalchemy 必须进 bundle，否则 exe 启动即 ModuleNotFoundError ----
      # 不放行到「删除旧 latest / 发布」：坏包一旦发布，用户下载即崩。
      # 检测用 Python os.walk（与上方 Verify bundle 同模式），避免 bash find 遍历中文目录名
      # （报告质控软件）时因编码/MSEYS 行为误判；且能确认是真包（含 __init__.py）。
      - name: Block release if SQLAlchemy missing in bundle
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: |
          python - <<'PY'
          import os, sys
          found = []
          if os.path.isdir("dist"):
              for root, dirs, files in os.walk("dist"):
                  if os.path.basename(root) == "sqlalchemy" and \
                     os.path.exists(os.path.join(root, "__init__.py")):
                      found.append(root)
          if not found:
              print("::error::SQLAlchemy 未打进 bundle，阻断发布（exe 启动会 ModuleNotFoundError: sqlalchemy）")
              sys.exit(1)
          print("SQLAlchemy 已打进 bundle，放行发布：", found[0])
          PY

      # ---- 生成 Inno Setup 安装包（用户选择要安装向导，必选）----
      - name: Install Inno Setup (with diagnostics)
        continue-on-error: true
        run: |
          $diag = "DIAG.md"
          "# 安装包诊断" | Out-File -FilePath $diag -Encoding utf8
          for ($i=1; $i -le 2; $i++) {
            "choco attempt $i" | Add-Content $diag
            choco install innosetup -y --no-progress *>&1 | Out-Null
            if (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") { "ISCC via choco OK" | Add-Content $diag; break }
            "choco attempt $i failed" | Add-Content $diag
            Start-Sleep -Seconds 5
          }
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            "choco 失败, 尝试官方下载" | Add-Content $diag
            try {
              Invoke-WebRequest -Uri "https://jrsoftware.org/download.php/is.exe" -OutFile "$env:TEMP\innosetup.exe" -MaximumRedirection 10 -ErrorAction Stop
              "下载完成, 开始静默安装" | Add-Content $diag
              Start-Process "$env:TEMP\innosetup.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
            } catch {
              "官方下载/安装异常: $_" | Add-Content $diag
            }
          }
          "ISCC 最终存在: $(Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')" | Add-Content $diag

      - name: Build installer (with diagnostics)
        continue-on-error: true
        working-directory: build
        run: |
          $diag = "../DIAG.md"
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            "ISCC 未找到, 跳过编译" | Add-Content $diag
            Write-Error "ISCC.exe 未找到"; exit 1
          }
          "开始编译 setup.iss" | Add-Content $diag
          # 版本号注入（2026-08-23）：APP_VERSION 来自 src/version.py（见前置 Resolve 步骤），
          # 经 /D 命令行 define 覆盖 setup.iss 的 #ifndef AppVersion 兜底值。
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:APP_VERSION" setup.iss 2>&1 | Add-Content $diag
          if ($LASTEXITCODE -ne 0) {
            "编译失败 exit $LASTEXITCODE" | Add-Content $diag
            Write-Error "Inno Setup 编译失败"; exit 1
          }
          "INSTALLER BUILD OK" | Add-Content $diag

      - name: Upload installer artifact
        uses: actions/upload-artifact@v5
        with:
          name: report-qc-installer
          path: installer/*.exe
          if-no-files-found: warn

      - name: Upload portable zip artifact
        uses: actions/upload-artifact@v5
        with:
          name: report-qc-portable-zip
          path: report-qc-portable.zip
          if-no-files-found: error

      # DIAG.md（安装包诊断）随产物传递给 publish job 写进 Release notes
      - name: Upload build diagnostics artifact
        if: hashFiles('DIAG.md') != ''
        uses: actions/upload-artifact@v5
        with:
          name: report-qc-build-diagnostics
          path: DIAG.md
          if-no-files-found: ignore

  # ---- 发布阶段（2026-08-23 新增）：仅在 launch-test 端到端通过后执行 ----
  # job 依赖链：build → launch-test → publish。
  # 此前顺序是「先发 Release 再跑 launch-test」，坏包一旦构建成功就已公开可下载，
  # e2e 失败也追不回来；现在 publish 需要 launch-test 全绿才放行。
  publish:
    needs: [launch-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download portable zip artifact
        uses: actions/download-artifact@v5
        with:
          name: report-qc-portable-zip
          path: .
      - name: Download installer artifact
        uses: actions/download-artifact@v5
        with:
          name: report-qc-installer
          path: installer
      - name: Download build diagnostics (optional)
        uses: actions/download-artifact@v5
        with:
          name: report-qc-build-diagnostics
          path: .
        continue-on-error: true

      # ---- 自动发布 latest Release（固定链接，公开仓库任何人可下载，永久不过期）----
      - name: Delete old latest release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --repo ${{ github.repository }} || true
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" :refs/tags/latest || true

      - name: Prepare release files
        shell: bash
        run: |
          FILES="report-qc-portable.zip"
          shopt -s nullglob
          for f in installer/*.exe; do FILES="$FILES,$f"; done
          echo "RELEASE_FILES=$FILES" >> "$GITHUB_ENV"

      - name: Prepare release notes (with installer diagnostics)
        shell: bash
        run: |
          {
            echo "医学影像报告质控软件 Windows 版（每次推代码自动构建，发布前已通过 exe 启动端到端测试）。"
            echo "- 绿色版：解压 report-qc-portable.zip，双击「报告质控软件.exe」即可运行（无需安装）"
            if ls installer/*.exe 1>/dev/null 2>&1; then
              echo "- 安装版：下载 installer 里的 exe，双击「下一步」安装，自动建桌面快捷方式"
            else
              echo "- 安装版：本次构建未生成安装包（Inno Setup 环境异常），仅提供绿色版"
            fi
            echo ""
            echo "## 安装包构建诊断"
            cat DIAG.md 2>/dev/null || echo "(无诊断信息)"
          } > RELEASE_BODY.md

      - name: Publish latest Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: 报告质控软件（最新版）
          files: ${{ env.RELEASE_FILES }}
          body_path: RELEASE_BODY.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---- 端到端启动测试：真实启动 exe，轮询后端 health（阻断闸） ----
  # 这是本仓库对「exe 能否正确打开」的唯一真实验证。
  # 此前多次启动崩溃（clr 加载失败、isatty、依赖缺失）都只在用户机器上暴露，
  # 因为 CI 只有静态检查（文件存在/import OK），从未真正启动过打包产物。
  # 此 job 在构建机真实拉起 exe → 探测 127.0.0.1:8500 health → 失败则 job 红，
  # 从而把「下载即崩」的坏包挡在发布前。
  launch-test:
    needs: build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Download portable bundle
        uses: actions/download-artifact@v5
        with:
          name: report-qc-exe
          path: dist-app
      - name: Launch exe and probe backend health
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: |
          python - <<'PY'
          import glob, json, os, subprocess, time, urllib.request

          exes = glob.glob("dist-app/**/报告质控软件.exe", recursive=True)
          print("found exe:", exes)
          assert exes, "未找到 dist 内的 报告质控软件.exe"
          exe = exes[0]
          cwd = os.path.dirname(exe)

          # 0) 启动前先验证 Python.Runtime.dll 是有效且未经 UPX 压缩的 .NET 程序集
          #    （用户报错点）。注意 Python.Runtime.Loader.Initialize 是 CLR 托管方法，
          #    不能用 ctypes.GetProcAddress 探测（恒失败）；检查 PE+.NET 头更可靠。
          import struct
          def _valid_net_dll(path):
              with open(path, "rb") as fh:
                  data = fh.read()
              if data[:2] != b"MZ": return False
              if b"UPX!" in data[:4096] or b"UPX!" in data[-256:]: return False
              pe_off = struct.unpack_from("<I", data, 0x3C)[0]
              if data[pe_off:pe_off + 4] != b"PE\x00\x00": return False
              magic = struct.unpack_from("<H", data, pe_off + 24)[0]
              dd_off = pe_off + 24 + (112 if magic == 0x20B else 96)
              clr_rva = struct.unpack_from("<I", data, dd_off + 14 * 8)[0]
              return clr_rva != 0
          pr_dll = glob.glob(os.path.join(cwd, "**", "pythonnet", "runtime", "Python.Runtime.dll"), recursive=True)
          print("pythonnet runtime dll:", pr_dll)
          if pr_dll:
              ok = _valid_net_dll(pr_dll[0])
              print(f"PYTHONNET DLL OK: {ok} ({os.path.getsize(pr_dll[0])} bytes)")
              if not ok:
                  print("::error::Python.Runtime.dll 无效或含 UPX 标记（CLR 无法反射 Loader.Initialize）")
                  raise SystemExit(1)
          else:
              print("WARN: 未在 exe 目录找到 pythonnet/runtime/Python.Runtime.dll（检查打包路径）")

          # 真实启动打包产物（cwd 必须是 exe 所在目录：冻结版按 exe 位置找资源）
          proc = subprocess.Popen([exe], cwd=cwd)
          print("launched pid:", proc.pid)

          # 轮询后端 health（最多 60s）。这同时证明：依赖完整、server 可 import、
          # FastAPI 能监听、静态资源可服务——即「exe 打开后能正常提供服务」。
          ok = False
          for i in range(30):
              time.sleep(2)
              try:
                  with urllib.request.urlopen(
                          "http://127.0.0.1:8500/api/v1/health", timeout=3) as r:
                      body = json.loads(r.read().decode("utf-8"))
                      if body.get("ok"):
                          ok = True
                          print(f"HEALTH OK after {(i + 1) * 2}s:", body)
                          break
              except Exception as e:
                  print(f"  probe {i + 1}: {type(e).__name__}: {e}")

          # 无论成败都终止进程（防泄漏占用 8500）
          try:
              proc.terminate()
          except Exception:
              pass
          time.sleep(1)
          try:
              proc.kill()
          except Exception:
              pass

          if not ok:
              print("::error::exe 启动后后端未就绪（依赖缺失/崩溃/端口未监听）")
              raise SystemExit(1)
          print("EXE_LAUNCH_E2E_OK")
          PY

  # ---- 自动更新端到端实测：latest Release 发布后，用真实的 Windows 安装器跑完整更新 ----
  # 2026-08-23：needs 由 build 改为 publish——本测试依赖刚发布的 latest Release 产物，
  # 重排后发布发生在 launch-test 通过之后，这里必须排在发布之后才有东西可测。
  test-update:
    needs: publish
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run Windows auto-update end-to-end test
        continue-on-error: true
        run: python tests/test_windows_update.py
        shell: bash
        env:
          PYTHONUTF8: "1"
