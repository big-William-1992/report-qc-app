name: Build Windows (exe + installer)

# 触发：手动点一下 / 推到 main / 打 v* tag
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest   # 真实 x64 Windows Server，产物兼容绝大多数 PC
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller + cryptography
        run: python -m pip install --upgrade pip pyinstaller cryptography

      - name: Install OCR dependencies (rapidocr + plugins)
        # 关键：屏幕区域 OCR 所需的全部「插件」（rapidocr/onnxruntime/opencv/pyclipper/Shapely 等）
        # 必须在打包前装好，否则 PyInstaller 收不到这些模块，exe 内 OCR 会 ModuleNotFoundError。
        run: python -m pip install -r requirements.txt

      - name: Write build info (供软件内检查更新比对)
        shell: bash
        run: |
          mkdir -p assets
          python - <<'PY'
          import json, datetime, os
          info = {
              "build_time": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"),
              "commit": os.environ.get("GITHUB_SHA", "")[:7] or "ci",
          }
          with open("assets/build_info.json", "w", encoding="utf-8") as f:
              json.dump(info, f, ensure_ascii=False, indent=2)
          print("build_info:", info)
          PY

      - name: Build exe (PyInstaller)
        run: python -m PyInstaller build/report_qc.spec --noconfirm --clean

      - name: Smoke test - engine import & run
        # 干净环境下验证引擎能正常 import 并跑一份示例报告（抓逻辑层错误）
        # 非阻断：即使引擎冒烟测试出问题，也不影响 exe 产物的上传
        run: python build/smoke_test.py
        continue-on-error: true

      - name: Verify OCR bundled in build
        # 阻断：确认 OCR 依赖真的装上了、且离线模型被打进了 dist（防止「假成功」）
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: |
          python - <<'PY'
          import os, sys
          ok = True
          # 1) OCR Python 依赖必须能 import（装了 requirements 才会通过）
          for m in ("rapidocr_onnxruntime", "onnxruntime", "cv2", "numpy", "PIL", "pyclipper", "shapely"):
              try:
                  __import__(m)
                  print("  import OK:", m)
              except Exception as e:
                  print("  import FAIL:", m, "->", e); ok = False
          # 2) 离线 OCR 模型：源(assets) 与 打包后(dist) 都要核对（避免中文路径误报）
          src_dir = os.path.join("assets", "ocr_models")
          src_files = sorted(os.listdir(src_dir)) if os.path.isdir(src_dir) else []
          print("  SRC assets/ocr_models:", src_files)
          if not src_files:
              print("  SRC OCR models MISSING (checkout 未拉到 onnx?)"); ok = False
          # 在 dist 下递归找任意 ocr_models 目录
          dist_onnx = []
          if os.path.isdir("dist"):
              for root, dirs, files in os.walk("dist"):
                  if os.path.basename(root) == "ocr_models":
                      dist_onnx = sorted(f for f in files if f.endswith(".onnx"))
          print("  DIST ocr_models onnx found:", dist_onnx)
          if len(dist_onnx) < 3:
              print("  DIST OCR models MISSING (PyInstaller 未打包 assets/ocr_models)")
              ok = False
          else:
              print("  OCR models bundled OK")
          sys.exit(0 if ok else 1)
          PY

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: report-qc-exe
          path: dist/报告质控软件/
          if-no-files-found: warn

      # ---- 打包绿色版 zip（供 Release 下载，解压即用）----
      - name: Package portable zip
        run: Compress-Archive -Path "dist/报告质控软件/*" -DestinationPath "report-qc-portable.zip" -Force

      # ---- 生成 Inno Setup 安装包（用户选择要安装向导，必选）----
      - name: Install Inno Setup (with diagnostics)
        continue-on-error: true
        run: |
          $diag = "DIAG.md"
          "# 安装包诊断" | Out-File -FilePath $diag -Encoding utf8
          for ($i=1; $i -le 2; $i++) {
            "choco attempt $i" | Add-Content $diag
            choco install innosetup -y --no-progress *>&1 | Out-Null
            if (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") { "ISCC via choco OK" | Add-Content $diag; break }
            "choco attempt $i failed" | Add-Content $diag
            Start-Sleep -Seconds 5
          }
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            "choco 失败, 尝试官方下载" | Add-Content $diag
            try {
              Invoke-WebRequest -Uri "https://jrsoftware.org/download.php/is.exe" -OutFile "$env:TEMP\innosetup.exe" -MaximumRedirection 10 -ErrorAction Stop
              "下载完成, 开始静默安装" | Add-Content $diag
              Start-Process "$env:TEMP\innosetup.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
            } catch {
              "官方下载/安装异常: $_" | Add-Content $diag
            }
          }
          "ISCC 最终存在: $(Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')" | Add-Content $diag

      - name: Build installer (with diagnostics)
        continue-on-error: true
        working-directory: build
        run: |
          $diag = "../DIAG.md"
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            "ISCC 未找到, 跳过编译" | Add-Content $diag
            Write-Error "ISCC.exe 未找到"; exit 1
          }
          "开始编译 setup.iss" | Add-Content $diag
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss 2>&1 | Add-Content $diag
          if ($LASTEXITCODE -ne 0) {
            "编译失败 exit $LASTEXITCODE" | Add-Content $diag
            Write-Error "Inno Setup 编译失败"; exit 1
          }
          "INSTALLER BUILD OK" | Add-Content $diag

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: report-qc-installer
          path: installer/*.exe
          if-no-files-found: warn

      # ---- 自动发布 latest Release（固定链接，公开仓库任何人可下载，永久不过期）----
      - name: Delete old latest release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes || true
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/big-William-1992/report-qc-app.git" :refs/tags/latest || true

      - name: Prepare release files
        shell: bash
        run: |
          FILES="report-qc-portable.zip"
          shopt -s nullglob
          for f in installer/*.exe; do FILES="$FILES,$f"; done
          echo "RELEASE_FILES=$FILES" >> "$GITHUB_ENV"

      - name: Prepare release notes (with installer diagnostics)
        shell: bash
        run: |
          {
            echo "医学影像报告质控软件 Windows 版（每次推代码自动构建）。"
            echo "- 绿色版：解压 report-qc-portable.zip，双击「报告质控软件.exe」即可运行（无需安装）"
            echo "- 安装版：若本次构建成功，下载 installer 里的 exe，双击「下一步」安装，自动建桌面快捷方式"
            echo ""
            echo "## 安装包构建诊断"
            cat DIAG.md 2>/dev/null || echo "(无诊断信息)"
          } > RELEASE_BODY.md

      - name: Publish latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 报告质控软件（最新版）
          files: ${{ env.RELEASE_FILES }}
          body_path: RELEASE_BODY.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---- 自动更新端到端实测：构建发布 latest 后，用真实的 Windows 安装器跑完整更新 ----
  test-update:
    needs: build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Windows auto-update end-to-end test
        run: python tests/test_windows_update.py
        shell: bash
        env:
          PYTHONUTF8: "1"
